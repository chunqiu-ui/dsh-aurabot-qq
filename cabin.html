<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>林中小屋 · 雪夜</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;
    background:radial-gradient(1200px 700px at 52% 38%, #eaf2f5 0%, #dde8ec 55%, #cfdde2 100%);
    font-family:"HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;}
  #c{display:block;width:100%;height:100%;cursor:grab}
  #c:active{cursor:grabbing}
  #labels{position:absolute;inset:0;pointer-events:none}
  .hot{position:absolute;left:0;top:0;padding:6px 12px;border-radius:10px;background:rgba(28,56,66,.92);
    color:#eaf3f5;font-size:14px;white-space:nowrap;box-shadow:0 6px 18px rgba(20,44,52,.22)}
  #title{position:absolute;left:30px;top:24px;font-size:26px;font-weight:800;color:#2a4750;letter-spacing:.5px}
  #sub{position:absolute;left:32px;top:62px;font-size:14px;color:#5c7981}
  #badge{position:absolute;right:28px;top:26px;padding:12px 20px;border-radius:14px;background:rgba(28,56,66,.94);
    color:#eaf3f5;font-size:18px;font-weight:700;box-shadow:0 14px 40px rgba(20,44,52,.24)}
  #badge em{font-style:normal;background:#f2c14e;color:#22343a;border-radius:8px;padding:3px 10px;margin-left:10px;font-size:14px}
  #foot{position:absolute;left:30px;bottom:24px;font-size:13px;color:#6c8489}
  #ui{position:absolute;left:28px;bottom:60px;padding:14px 16px;border-radius:16px;background:rgba(28,56,66,.92);
    color:#eaf3f5;box-shadow:0 14px 40px rgba(20,44,52,.26)}
  #ui .ttl{font-size:14px;font-weight:700;letter-spacing:.5px;margin-bottom:9px;color:#8fd3d8}
  #ui .row{display:flex;gap:8px;flex-wrap:wrap}
  #ui button{appearance:none;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);
    color:#eaf3f5;font-size:13px;padding:7px 12px;border-radius:9px;cursor:pointer}
  #ui button:hover{background:rgba(255,255,255,.16)}
  #ui button.on{background:#f2c14e;color:#22343a;border-color:#f2c14e;font-weight:700}
  #hint{position:absolute;right:26px;bottom:24px;padding:10px 16px;border-radius:12px;background:rgba(28,56,66,.72);
    color:#cfe0e4;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="title">林中小屋 · 雪夜</div>
<div id="sub">three.js 程序化建模 · 雪夜暖光</div>


<div id="ui">
  <div class="ttl">视角</div>
  <div class="row">
    <button data-view="iso">等轴测</button>
    <button data-view="front">正面</button>
    <button data-view="top">俯视</button>
    <button data-view="low">低角</button>
    <button data-view="rot">自动旋转</button>
  </div>
</div>

<div id="hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>
